# Argo CD installs the Rancher chart with this file and with
# rancher/values.yaml from the private configuration repository, which sets
# the hostname. The chart version is in
# apps/argocd/applications/templates/rancher.yaml.

replicas: 2

ingress:
  ingressClassName: traefik
  tls:
    # The certificate is the tls-rancher-ingress Secret, issued by
    # cert-manager for the Certificate in charts/routes.
    source: secret

# The chart can only take the first-login password as a plain value, which
# cannot go in git. It is left unset here. Argo CD deploys the
# bootstrap-secret Secret from the private configuration repository instead,
# and this gives Rancher the same environment variable the chart would have.
extraEnv:
  - name: CATTLE_BOOTSTRAP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: bootstrap-secret
        key: bootstrapPassword

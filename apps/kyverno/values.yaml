# Kyverno: a policy engine that checks every resource against written rules
# when it is created or changed, and re-checks existing resources in the
# background. The results are PolicyReport resources
# (kubectl get policyreports -A).
#
# Argo CD installs the chart with this file; the chart version is in
# apps/argocd/applications/kyverno.yaml.

features:
  # Kyverno sits in the path of every create and update. If its pods are down
  # (node maintenance, a bad upgrade), let requests through unchecked instead
  # of refusing them, whatever an individual policy asks for.
  forceFailurePolicyIgnore:
    enabled: true

admissionController:
  serviceMonitor:
    enabled: true
backgroundController:
  serviceMonitor:
    enabled: true
cleanupController:
  serviceMonitor:
    enabled: true
reportsController:
  serviceMonitor:
    enabled: true

# The policy CRDs come from a sub-chart that gives them an empty "labels: {}"
# by default. The API server drops an empty map, so on a freshly installed
# cluster Argo CD would show those CRDs as out of sync for ever. A real label
# avoids that.
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    homelab/crds-from: kyverno-api

# Argo CD installs the Traefik chart with this file; the chart version is in
# apps/argocd/applications/templates/traefik.yaml.
#
# Logging uses the chart's "log:" key; older charts called it "logs:".

deployment:
  replicas: 2

service:
  type: LoadBalancer
  annotations: {}

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# Current Traefik chart uses "log", not "logs".
log:
  level: INFO
  # Plain text in Grafana's log panels instead of ANSI color codes.
  noColor: true

# One line per request on stdout, which Alloy ships to Loki for the
# Grafana Traefik dashboard's logs panel. Without this Traefik only logs
# startup and errors, so the panel is empty for most time ranges.
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      # The chart default; request headers can carry cookies and tokens.
      defaultMode: drop
    queryParameters:
      # Query strings can carry OIDC codes and tokens (Authelia callbacks).
      defaultMode: drop

ports:
  web:
    # Internal Traefik entrypoint port.
    port: 8000
    expose:
      default: true
    exposedPort: 80
    http:
      # Drop headers whose names alias another header (X_Auth_User for
      # X-Auth-User) so clients cannot spoof headers Traefik manages.
      aliasHeadersStrategy: delete

  websecure:
    # Internal Traefik entrypoint port.
    port: 8443
    expose:
      default: true
    exposedPort: 443
    http:
      aliasHeadersStrategy: delete

  traefik:
    # Keep the management/dashboard entrypoint private.
    port: 9000
    expose:
      default: false
    exposedPort: 9000
    http:
      aliasHeadersStrategy: delete

  metrics:
    http:
      aliasHeadersStrategy: delete

additionalArguments:
  # Set legacy naming explicitly to silence the startup warning (the chart omits
  # the flag when false). true would rename routers/services: breaking.
  - "--providers.kubernetescrd.safeNaming=false"
  # Reject %00 in request paths (no legitimate use). Denying any encoded
  # character on an entrypoint also silences the startup warning.
  - "--entryPoints.web.http.encodedCharacters.allowEncodedNullCharacter=false"
  - "--entryPoints.websecure.http.encodedCharacters.allowEncodedNullCharacter=false"

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: protected-apps-daily
  namespace: velero
spec:
  # Off minute 17: Longhorn's snapshot-6hour job (UTC) snapshots the same
  # volumes at 01:17 Chicago daylight time.
  schedule: "CRON_TZ=America/Chicago 47 1 * * *"
  skipImmediately: true
  template:
    includedNamespaces:
      - trilium
      - vaultwarden
      - authelia
      - monitoring
      # logging (Loki) is left out: its Longhorn snapshot clone intermittently
      # fails and left the whole backup PartiallyFailed. Longhorn's
      # backup-nightly still covers the Loki volume.
    snapshotMoveData: true
    storageLocation: garage
    ttl: 168h

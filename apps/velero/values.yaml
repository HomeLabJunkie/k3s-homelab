# Argo CD installs the Velero chart with this file and with velero/values.yaml
# from the private configuration repository. The chart version is in
# apps/argocd/applications/templates/velero.yaml.

---
image:
  repository: docker.io/velero/velero
  tag: v1.18.4
  pullPolicy: IfNotPresent

initContainers:
  - name: velero-plugin-for-aws
    # Never v1.14.2: it corrupts metadata on non-AWS S3 backends via SDK
    # checksum framing (velero-io/velero#9951). v1.14.3 and later are fine; run
    # scripts/test-velero-backup.sh after every plugin change.
    image: docker.io/velero/velero-plugin-for-aws:v1.14.4
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    # The image's own user is 65532; it only copies the plugin into /target.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

# The server already runs as the image's cnb user (uid 1002, gid 1000, seen
# on the node). The image names the user rather than numbering it, so the
# numbers are given here for runAsNonRoot to check. The root filesystem stays
# writable: the repository maintenance jobs copy these settings, and kopia
# writes a cache there.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1002
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

configuration:
  backupStorageLocation:
    - name: garage
      provider: aws
      bucket: k3s-velero
      default: true
      accessMode: ReadWrite
      credential:
        name: velero-garage-credentials
        key: cloud
      config:
        checksumAlgorithm: ""
        region: garage
        s3ForcePathStyle: "true"
        # Placeholder. velero/values.yaml in the private configuration
        # repository repeats this whole list with the store's real address.
        s3Url: http://garage.example.invalid:3900
  volumeSnapshotLocation: []
  features: EnableCSI
  defaultBackupStorageLocation: garage
  defaultSnapshotMoveData: true
  defaultBackupTTL: 168h
  defaultItemOperationTimeout: 6h
  uploaderType: kopia
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 3

credentials:
  useSecret: true
  existingSecret: velero-garage-credentials

backupsEnabled: true
snapshotsEnabled: false
deployNodeAgent: true

nodeAgent:
  disableHostPath: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  extraArgs:
    - --node-agent-configmap=velero-velero-node-agent-config
    # Longhorn fully copies each snapshot into a temporary volume before the
    # upload starts. Headroom over the 30m default; it does not fix Loki's
    # intermittent clone failures (see docs/backups.md).
    - --data-mover-prepare-timeout=90m

configMaps:
  velero-node-agent-config:
    data:
      config.json: |
        {
          "loadConcurrency": {
            "globalConfig": 1
          },
          "backupPVC": {
            "longhorn": {
              "storageClass": "longhorn-velero-temp"
            }
          },
          "podResources": {
            "cpuRequest": "100m",
            "memoryRequest": "256Mi"
          }
        }

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

metrics:
  enabled: true
  serviceMonitor:
    autodetect: true
    enabled: true
    additionalLabels:
      release: monitoring
  nodeAgentPodMonitor:
    autodetect: true
    enabled: true
    additionalLabels:
      release: monitoring
  prometheusRule:
    autodetect: true
    enabled: true
    additionalLabels:
      release: monitoring
    spec:
      - alert: VeleroBackupFailed
        annotations:
          summary: Velero backup failed
          description: "Velero schedule {{ $labels.schedule }} has a failed backup."
        expr: 'velero_backup_last_status{schedule!=""} != 1'
        for: 15m
        labels:
          severity: critical
      - alert: VeleroNoFreshBackup
        annotations:
          summary: Velero has no fresh scheduled backup
          description: "Velero schedule {{ $labels.schedule }} has no successful backup newer than 30 hours."
        expr: '(time() - velero_backup_last_successful_timestamp{schedule!=""}) > 108000'
        for: 30m
        labels:
          severity: critical

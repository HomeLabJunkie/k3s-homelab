# Requires Secret "fb-search" (APP_PASSWORD, SESSION_SECRET), created out of band and not stored in git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fb-search
spec:
  replicas: 1
  # The deps volume is ReadWriteOnce; the old pod must release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fb-search
  template:
    metadata:
      labels:
        app: fb-search
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Dependencies persist on the fb-search-deps volume. They are reinstalled
        # (hash-verified) only when requirements.txt or the Python version
        # changes, so ordinary restarts do not need PyPI at all.
        - name: deps
          image: mcr.microsoft.com/playwright/python:v1.63.0-noble
          command:
            - sh
            - -c
            - |
              set -eu
              want="$( { cat /req/requirements.txt; python --version; } | sha256sum | cut -d' ' -f1)"
              if [ "$(cat /deps/.installed 2>/dev/null || true)" = "$want" ]; then
                echo "dependencies already installed ($want)"
                exit 0
              fi
              find /deps -mindepth 1 -delete
              pip install --no-cache-dir --require-hashes --target /deps -r /req/requirements.txt
              echo "$want" > /deps/.installed
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: deps
              mountPath: /deps
            - name: requirements
              mountPath: /req
              readOnly: true
      containers:
        - name: fb-search
          image: mcr.microsoft.com/playwright/python:v1.63.0-noble
          workingDir: /app
          command:
            - python
            - -m
            - uvicorn
            - webapp:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          env:
            - name: MARKETPLACE_LOCATION
              value: "Bellevue, NE"
            - name: PYTHONPATH
              value: /deps
          envFrom:
            - secretRef:
                name: fb-search
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /fb-search/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # A search holds a browser for up to ~a minute but healthz is served by a separate
          # threadpool worker, so allow generous slack before restarting.
          livenessProbe:
            httpGet:
              path: /fb-search/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: deps
              mountPath: /deps
              readOnly: true
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: deps
          persistentVolumeClaim:
            claimName: fb-search-deps
        - name: app
          configMap:
            name: fb-search-app
        - name: requirements
          configMap:
            name: fb-search-requirements

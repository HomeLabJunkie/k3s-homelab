apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: website
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml
# Hash-suffixed name: editing src/ changes the ConfigMap name, which rolls the Deployment automatically.
configMapGenerator:
  - name: fb-search-app
    files:
      - src/local_hunter.py
      - src/scraper.py
      - src/webapp.py
  # Changing requirements.txt renames this ConfigMap too, so the init container reinstalls.
  - name: fb-search-requirements
    files:
      - requirements.txt

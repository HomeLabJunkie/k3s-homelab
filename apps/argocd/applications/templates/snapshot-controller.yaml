{{- if not (has "snapshot-controller" .Values.disabled) }}
# The CSI snapshot API (CRDs) and its controller, straight from the upstream
# repository at a pinned tag. Longhorn's volume snapshots, and Velero's
# backups of volumes, are built on it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://github.com/kubernetes-csi/external-snapshotter.git
      targetRevision: v8.6.0
      path: client/config/crd
    - repoURL: https://github.com/kubernetes-csi/external-snapshotter.git
      targetRevision: v8.6.0
      path: deploy/kubernetes/snapshot-controller
  syncPolicy:
    # Apply changes from git by itself and undo manual edits to what it
    # manages. It never deletes: removing something from git leaves it in the
    # cluster, marked out of sync, until it is deleted by hand.
    automated:
      selfHeal: true
      prune: false
    # Keep trying if a sync fails because something it needs is not there
    # yet, such as a namespace or a CRD another application creates.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      # Server-side apply: these charts carry CRDs too large for the
      # annotation that client-side apply writes.
      - ServerSideApply=true
{{- end }}

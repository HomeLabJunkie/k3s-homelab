{{- if not (has "website" .Values.disabled) }}
# The website, and every route for its host including /fb-search.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: website
  sources:
    # The chart, from this repository...
    - repoURL: https://github.com/HomeLabJunkie/k3s-homelab.git
      targetRevision: {{ .Values.revision }}
      path: charts/website
      helm:
        releaseName: website
        valueFiles:
          - $config/{{ .Values.config.path }}website/values.yaml
    # ...the domain, from the private configuration repository. Argo CD
    # reads it with the deploy key in the repo-k3s-homelab-config Secret...
    - repoURL: git@github.com:HomeLabJunkie/k3s-homelab-config.git
      targetRevision: {{ .Values.config.revision }}
      ref: config
    # ...and git-sync's deploy key (the jeffriffle-git Secret), which KSOPS
    # decrypts from the same repository.
    - repoURL: git@github.com:HomeLabJunkie/k3s-homelab-config.git
      targetRevision: {{ .Values.config.revision }}
      path: {{ .Values.config.path }}website
  syncPolicy:
    # Apply changes from git by itself and undo manual edits to what it
    # manages. It also deletes: something removed from git is removed from
    # the cluster. This application holds only configuration, nothing with
    # data and no CRDs, so a leftover is the greater risk.
    automated:
      selfHeal: true
      prune: true
    # Keep trying if a sync fails because something it needs is not there
    # yet, such as a namespace or a CRD another application creates.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # Delete what was removed from git only after everything else in the
      # sync has been applied and is healthy.
      - PruneLast=true
      - CreateNamespace=true
{{- end }}

{{- if not (has "traefik" .Values.disabled) }}
# Traefik, the ingress controller every site and admin UI is reached through.
# MetalLB gives its Service the first address of the load-balancer pool.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  sources:
    # The chart, at a pinned version...
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.7.1
      helm:
        releaseName: traefik
        valueFiles:
          - $values/apps/traefik/values.yaml
    # ...and its values, from this repository.
    - repoURL: https://github.com/HomeLabJunkie/k3s-homelab.git
      targetRevision: {{ .Values.revision }}
      ref: values
  syncPolicy:
    # Apply changes from git by itself and undo manual edits to what it
    # manages. It never deletes: removing something from git leaves it in the
    # cluster, marked out of sync, until it is deleted by hand.
    automated:
      selfHeal: true
      prune: false
    # Keep trying if a sync fails because something it needs is not there
    # yet, such as a namespace or a CRD another application creates.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      # Server-side apply: these charts carry CRDs too large for the
      # annotation that client-side apply writes.
      - ServerSideApply=true
{{- end }}

{{- if not (has "sock-shop" .Values.disabled) }}
# Sock Shop, the microservices demo store from Argo CD's example
# applications, built by Kustomize straight from that repository at a pinned
# commit. It has no route: reach the store with
#   kubectl -n sock-shop port-forward svc/front-end 8079:80
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sock-shop
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: sock-shop
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: 8088f4c0d970abb09e250248cc97e35623447cb5
    path: sock-shop
    kustomize:
      patches:
        # Its Ingress is for ingress-nginx, which this cluster does not run.
        # Left in, it would never get an address and keep the application
        # Progressing.
        - target:
            kind: Ingress
            name: front-end-ingress
          patch: |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: front-end-ingress
  syncPolicy:
    # Apply changes from git by itself and undo manual edits to what it
    # manages. It also deletes: something removed from git is removed from
    # the cluster. The demo keeps its databases in the pods, with no volume
    # claims, so there is nothing to lose.
    automated:
      selfHeal: true
      prune: true
    # Keep trying if a sync fails because something it needs is not there
    # yet, such as a namespace or a CRD another application creates.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if not (has "rancher" .Values.disabled) }}
# Rancher, the cluster management UI. Its hostname and its first-login
# password (the bootstrap-secret Secret) come from the private configuration
# repository. Rancher installs further components by itself (its webhook,
# Fleet, the system upgrade controller); those are not part of this
# application. deploy.sh still sets the admin password and server URL
# through Rancher's API after the first install.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system
  sources:
    # The chart, at a pinned version, with the values from this repository
    # and the hostname from the configuration repository...
    - repoURL: https://releases.rancher.com/server-charts/stable
      chart: rancher
      targetRevision: 2.15.2
      helm:
        releaseName: rancher
        valueFiles:
          - $values/apps/rancher/values.yaml
          - $config/{{ .Values.config.path }}rancher/values.yaml
    - repoURL: https://github.com/HomeLabJunkie/k3s-homelab.git
      targetRevision: {{ .Values.revision }}
      ref: values
    - repoURL: git@github.com:HomeLabJunkie/k3s-homelab-config.git
      targetRevision: {{ .Values.config.revision }}
      ref: config
    # ...and its Secret, which KSOPS decrypts from the same repository.
    - repoURL: git@github.com:HomeLabJunkie/k3s-homelab-config.git
      targetRevision: {{ .Values.config.revision }}
      path: {{ .Values.config.path }}rancher
  syncPolicy:
    # Apply changes from git by itself and undo manual edits to what it
    # manages. It never deletes: removing something from git leaves it in the
    # cluster, marked out of sync, until it is deleted by hand.
    automated:
      selfHeal: true
      prune: false
    # Keep trying if a sync fails because something it needs is not there
    # yet, such as a namespace or a CRD another application creates.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
{{- end }}

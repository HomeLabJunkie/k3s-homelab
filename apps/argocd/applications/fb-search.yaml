# fb-search, built by Kustomize. Its manifests and source are in the private
# configuration repository, because the source is not published. Its route is
# in the website application. The fb-search Secret (APP_PASSWORD,
# SESSION_SECRET) is created by hand and is not in git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fb-search
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: website
  source:
    repoURL: git@github.com:HomeLabJunkie/k3s-homelab-config.git
    targetRevision: main
    path: fb-search
  syncPolicy:
    # Apply changes from git by itself and undo manual edits to what it
    # manages. It never deletes: removing something from git leaves it in the
    # cluster, marked out of sync, until it is deleted by hand.
    automated:
      selfHeal: true
      prune: false
    # Keep trying if a sync fails because something it needs is not there
    # yet, such as a namespace or a CRD another application creates.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

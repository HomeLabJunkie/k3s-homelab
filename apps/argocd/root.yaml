# The one Application deploy.sh applies by hand. It makes Argo CD render the
# chart in apps/argocd/applications on the main branch and create every
# Application in it, so adding an application is a commit, not a command.
# This file describes production. For a test cluster, deploy.sh changes the
# branch and passes the chart other values (ARGOCD_APPS_* in cluster.env).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/HomeLabJunkie/k3s-homelab.git
    targetRevision: main
    path: apps/argocd/applications
  syncPolicy:
    # Deleting an Application file does not delete the Application: that
    # would be the first step towards removing what it deployed.
    automated:
      selfHeal: true
      prune: false

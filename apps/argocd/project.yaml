# The project every Application in this repository belongs to. It limits
# where Argo CD may read from: this repository, the private configuration
# repository and the chart repositories named here. A source anywhere else is
# refused.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Applications deployed from the k3s-homelab repository
  sourceRepos:
    - https://github.com/HomeLabJunkie/k3s-homelab.git
    - git@github.com:HomeLabJunkie/k3s-homelab-config.git
    - https://aquasecurity.github.io/helm-charts
    - https://kyverno.github.io/kyverno/
    - https://charts.jetstack.io
    - https://traefik.github.io/charts
    - https://releases.rancher.com/server-charts/stable
    - https://vmware-tanzu.github.io/helm-charts
    - https://github.com/kubernetes-csi/external-snapshotter.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://argoproj.github.io/argo-helm
    - https://kubernetes-sigs.github.io/headlamp/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

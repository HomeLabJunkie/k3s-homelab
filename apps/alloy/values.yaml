# Argo CD installs the chart with this file; the chart version is in
# apps/argocd/applications/templates/alloy.yaml.

global:
  podSecurityContext:
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

controller:
  type: deployment
  replicas: 1
  # Alloy keeps its read positions in its storage path (/tmp/alloy). The root
  # filesystem is read-only, so that path is a scratch volume; it was already
  # lost on every restart.
  volumes:
    extra:
      - name: storage
        emptyDir:
          sizeLimit: 256Mi

alloy:
  enableReporting: false
  # Alloy reads logs through the Kubernetes API, not from host folders, so it
  # needs no root: run as the image's own alloy user (473).
  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  mounts:
    extra:
      - name: storage
        mountPath: /tmp/alloy
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          target_label = "cluster"
          replacement  = "k3s-homelab"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.drop_stale.receiver]
      }

      // On reconnect, loki.source.kubernetes resends the last line it read.
      // For a pod that has been quiet longer than Loki's 168h
      // reject_old_samples_max_age, Loki rejects that line and the whole
      // batch is logged as dropped, on every reconnect. Drop such lines here,
      // with an hour of margin for delivery delay.
      loki.process "drop_stale" {
        forward_to = [loki.write.local.receiver]

        stage.drop {
          older_than          = "167h"
          drop_counter_reason = "older_than_loki_max_age"
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push"
        }
      }

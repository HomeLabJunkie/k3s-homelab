# Network policy for the headlamp namespace. Headlamp acts as cluster-admin
# for anyone who reaches it and has no login of its own, so only Traefik,
# which puts Authelia in front, may connect. Outgoing traffic (to the
# Kubernetes API) is not limited.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-only
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4466

controller:
  type: deployment
  replicas: 1

alloy:
  enableReporting: false
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          target_label = "cluster"
          replacement  = "k3s-homelab"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.drop_stale.receiver]
      }

      // On reconnect, loki.source.kubernetes resends the last line it read.
      // For a pod that has been quiet longer than Loki's 168h
      // reject_old_samples_max_age, Loki rejects that line and the whole
      // batch is logged as dropped, on every reconnect. Drop such lines here,
      // with an hour of margin for delivery delay.
      loki.process "drop_stale" {
        forward_to = [loki.write.local.receiver]

        stage.drop {
          older_than          = "167h"
          drop_counter_reason = "older_than_loki_max_age"
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push"
        }
      }

---
extra_agent_args: ""
group_name_master: master
systemd_dir: /etc/systemd/system
# Root-only file the agent reads its join token from, instead of the unit's
# world-readable command line.
k3s_agent_token_file: /etc/rancher/k3s/agent-token
# Wait for the node to be Ready, not merely registered. A fresh bootstrap turns
# this off: nodes cannot be Ready until the CNI is installed afterwards.
k3s_agent_wait_for_ready: true

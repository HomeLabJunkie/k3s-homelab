---
- name: Check for PXE-booted system
  block:
    - name: Check if system is PXE-booted
      ansible.builtin.command:
        cmd: cat /proc/cmdline
      register: boot_cmdline
      changed_when: false
      check_mode: false

    - name: Set fact for PXE-booted system
      ansible.builtin.set_fact:
        is_pxe_booted: "{{ 'root=/dev/nfs' in boot_cmdline.stdout }}"
      when: boot_cmdline.stdout is defined

    - name: Include http_proxy configuration tasks
      ansible.builtin.include_tasks: http_proxy.yml

- name: Deploy K3s http_proxy conf
  ansible.builtin.include_tasks: http_proxy.yml
  when: proxy_env is defined

- name: Configure the k3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ systemd_dir }}/k3s-node.service"
    owner: root
    group: root
    mode: "0755"
  register: k3s_agent_service

- name: Restart k3s agent when configuration changed # noqa no-handler
  ansible.builtin.systemd:
    name: k3s-node
    daemon_reload: true
    state: restarted
    enabled: true
  when: k3s_agent_service.changed

- name: Ensure k3s agent is enabled and running
  ansible.builtin.systemd:
    name: k3s-node
    daemon_reload: true
    state: started
    enabled: true
  when: not k3s_agent_service.changed

- name: Wait for k3s agent node to become Ready
  ansible.builtin.command:
    cmd: >-
      k3s kubectl get node {{ ansible_facts.hostname }}
      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ groups[group_name_master | default('master')][0] }}"
  become: true
  register: k3s_agent_ready
  changed_when: false
  retries: 60
  delay: 2
  until:
    - k3s_agent_ready.rc == 0
    - k3s_agent_ready.stdout | trim == 'True'
  when: not ansible_check_mode

---
- name: Validate reconciliation inputs
  ansible.builtin.assert:
    that:
      - apiserver_endpoint is defined
      - apiserver_endpoint | trim | length > 0
      - apiserver_endpoint is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - k3s_token is defined
      - k3s_token | trim | length > 0
      - k3s_node_ip is defined
      - k3s_node_ip | trim | length > 0
    fail_msg: >-
      Refusing K3s reconciliation because critical cluster configuration
      is missing or invalid.

- name: Verify existing embedded-etcd membership
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd/member
  register: reconcile_etcd_member

- name: Refuse reconciliation of a non-etcd server
  ansible.builtin.assert:
    that:
      - reconcile_etcd_member.stat.exists
    fail_msg: >-
      This task file is only for an existing embedded-etcd server.

- name: Detect alternate K3s config file
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: reconcile_config_yaml

- name: Show reconciliation plan
  ansible.builtin.debug:
    msg:
      - "host={{ inventory_hostname }}"
      - "node_ip={{ k3s_node_ip }}"
      - "api_vip={{ apiserver_endpoint }}"
      - "alternate_config={{ reconcile_config_yaml.stat.exists }}"
      - "mode=service-only-reconciliation"

- name: Archive alternate K3s config
  ansible.builtin.command:
    cmd: >-
      mv /etc/rancher/k3s/config.yaml
      /etc/rancher/k3s/config.yaml.pre-ansible-{{ ansible_facts["date_time"]["iso8601_basic_short"] }}
    removes: /etc/rancher/k3s/config.yaml
  register: reconcile_config_archive
  when: reconcile_config_yaml.stat.exists

- name: Render Ansible-managed K3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ systemd_dir }}/k3s.service"
    owner: root
    group: root
    mode: "0644"
  register: reconcile_service

- name: Restart K3s when effective configuration changed
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    state: restarted
    enabled: true
  when:
    - >
      reconcile_service.changed or
      (reconcile_config_archive is defined and
       reconcile_config_archive.changed | default(false))

- name: Ensure K3s is enabled and running when no restart was required
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    state: started
    enabled: true
  when:
    - not reconcile_service.changed
    - not (
        reconcile_config_archive is defined and
        reconcile_config_archive.changed | default(false)
      )

- name: Wait for local Kubernetes API readiness
  ansible.builtin.command:
    cmd: "{{ k3s_kubectl_binary | default('k3s kubectl') }} get --raw=/readyz"
  register: reconcile_readyz
  changed_when: false
  retries: 60
  delay: 2
  until:
    - reconcile_readyz.rc == 0
    - reconcile_readyz.stdout | trim == 'ok'
  when: not ansible_check_mode

- name: Wait for reconciled node to become Ready
  ansible.builtin.command:
    cmd: >-
      {{ k3s_kubectl_binary | default('k3s kubectl') }}
      get node {{ ansible_facts.hostname }}
      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: reconcile_node_ready
  changed_when: false
  retries: 60
  delay: 2
  until:
    - reconcile_node_ready.rc == 0
    - reconcile_node_ready.stdout | trim == 'True'
  when: not ansible_check_mode

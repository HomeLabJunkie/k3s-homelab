grafana:
  enabled: true
  defaultDashboardsEnabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Infinity queries web APIs; the jeffriffle.com dashboard uses it for Cloudflare
  # Web Analytics (GraphQL). Grafana installs it at start-up (id@version).
  plugins:
    - yesoreyeram-infinity-datasource@4.0.0
  # Read-only Cloudflare "Account Analytics" token for the Infinity data source.
  # deploy.sh creates grafana-cloudflare from CLOUDFLARE_ANALYTICS_TOKEN.
  envValueFrom:
    CF_ANALYTICS_TOKEN:
      secretKeyRef:
        name: grafana-cloudflare
        key: token
  # Single sign-on through Authelia (OIDC). deploy.sh creates grafana-oidc with
  # the domain-specific settings: GF_SERVER_ROOT_URL, the Authelia endpoint
  # URLs, the sign-out redirect and the client secret.
  envFromSecret: grafana-oidc
  grafana.ini:
    auth:
      # Never attach an SSO sign-in to an existing user by matching email.
      oauth_allow_insecure_email_lookup: false
    auth.generic_oauth:
      enabled: true
      name: Authelia
      icon: signin
      client_id: grafana
      scopes: openid profile email groups
      empty_scopes: false
      use_pkce: true
      # Go straight to Authelia. The local admin login is the break-glass way
      # in: /login?disableAutoLogin=true with GRAFANA_ADMIN_PASSWORD.
      auto_login: true
      allow_sign_up: true
      # The email is the login, so the SSO user never collides with the local
      # "admin" user (the Authelia username is also admin).
      login_attribute_path: email
      email_attribute_path: email
      name_attribute_path: name
      groups_attribute_path: groups
      # Only Authelia's admins group gets in, as Grafana server admins.
      role_attribute_path: contains(groups[*], 'admins') && 'GrafanaAdmin' || ''
      role_attribute_strict: true
      allow_assign_grafana_admin: true
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
  service:
    type: ClusterIP

# K3s does not expose kube-proxy metrics through the upstream
# kube-prometheus-stack ServiceMonitor. Leaving this rule enabled produces a
# permanent KubeProxyDown alert even when cluster networking is healthy.
defaultRules:
  rules:
    kubeProxy: false

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 15d
    retentionSize: 45GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  service:
    type: ClusterIP
  alertmanagerSpec:
    configSecret: alertmanager-smtp
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
prometheusOperator:
  enabled: true

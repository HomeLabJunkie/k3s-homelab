# The private HomeLabJunkie/jeffriffle.com repo builds the site onto its
# `deploy` branch. git-sync keeps a checkout of that branch current (checking
# every 60s) and nginx serves it. Edits made at /admin go live without a rollout.
# The jeffriffle-git Secret (read-only deploy key) is not part of this chart:
# the website application deploys it from the private configuration
# repository. After changing the key, restart this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeffriffle
  namespace: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jeffriffle
  template:
    metadata:
      labels:
        app: jeffriffle
      annotations:
        # nginx reads its config only at start-up, so a change to the
        # ConfigMap changes this value and rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        # Both images already run as non-root users (git-sync 65533, nginx 101);
        # this makes Kubernetes refuse to start one that would run as root.
        runAsNonRoot: true
        # git-sync runs as 65533; the group lets it read the deploy key
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # First checkout, so nginx never starts with an empty directory
      - name: git-sync-init
        image: registry.k8s.io/git-sync/git-sync:v4.7.1
        args:
        - --repo=git@github.com:HomeLabJunkie/jeffriffle.com.git
        - --ref=deploy
        - --depth=1
        - --root=/git
        - --link=current
        - --ssh-key-file=/etc/git-secret/ssh
        - --ssh-known-hosts-file=/etc/git-known-hosts/known_hosts
        - --one-time
        volumeMounts: &gitsync-mounts
        - name: git
          mountPath: /git
        - name: git-secret
          mountPath: /etc/git-secret
          readOnly: true
        - name: config
          mountPath: /etc/git-known-hosts
          readOnly: true
        # git-sync's HOME; it writes a gitconfig there
        - name: git-sync-tmp
          mountPath: /tmp
        securityContext: &restricted
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources: &gitsync-resources
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      # Native sidecar: keeps /git/current in step with the deploy branch
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.7.1
        restartPolicy: Always
        args:
        - --repo=git@github.com:HomeLabJunkie/jeffriffle.com.git
        - --ref=deploy
        - --depth=1
        - --root=/git
        - --link=current
        - --ssh-key-file=/etc/git-secret/ssh
        - --ssh-known-hosts-file=/etc/git-known-hosts/known_hosts
        - --period=60s
        volumeMounts: *gitsync-mounts
        securityContext: *restricted
        resources: *gitsync-resources
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.30-alpine
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: git
          mountPath: /git
          readOnly: true
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: nginx-tmp
          mountPath: /tmp
        # Keep serving for a few seconds after the pod is told to stop, so
        # Traefik has dropped it from its list before nginx goes away.
        # Without this a rollout fails the requests already on their way.
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
        securityContext: *restricted
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      volumes:
      - name: git
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: git-sync-tmp
        emptyDir: {}
      - name: git-secret
        secret:
          secretName: jeffriffle-git
          defaultMode: 0400
      - name: config
        configMap:
          name: jeffriffle

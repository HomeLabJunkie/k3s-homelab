apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-grafana-ingress
  namespace: monitoring
spec:
  secretName: tls-grafana-ingress
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - grafana.{{ .Values.domain }}
---
# An IngressRoute, not an Ingress: Traefik loads IngressRoutes and Middlewares
# together, so the route never starts up before its middleware exists.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.{{ .Values.domain }}`)
      kind: Rule
      middlewares:
        # Grafana keeps its own login behind Authelia; see charts/authelia.
        - name: admin-ui-auth
          namespace: traefik
      services:
        - name: monitoring-grafana
          port: 80
  tls:
    secretName: tls-grafana-ingress
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-prometheus-ingress
  namespace: monitoring
spec:
  secretName: tls-prometheus-ingress
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - prometheus.{{ .Values.domain }}
---
# An IngressRoute, not an Ingress: Traefik loads IngressRoutes and Middlewares
# together, so the route never starts up before its middleware exists.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.{{ .Values.domain }}`)
      kind: Rule
      middlewares:
        # Prometheus has no login of its own; see charts/authelia.
        - name: admin-ui-auth
          namespace: traefik
      services:
        - name: monitoring-kube-prometheus-prometheus
          port: 9090
  tls:
    secretName: tls-prometheus-ingress

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-headlamp-ingress
  namespace: headlamp
spec:
  secretName: tls-headlamp-ingress
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - headlamp.{{ required "domain is required" .Values.domain }}
---
# An IngressRoute, not an Ingress: Traefik loads IngressRoutes and Middlewares
# together, so the route never starts up before its middleware exists.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headlamp.{{ .Values.domain }}`)
      kind: Rule
      middlewares:
        # Headlamp has no login of its own: Authelia is the only gate.
        - name: admin-ui-auth
          namespace: traefik
      services:
        - name: headlamp
          port: 80
  tls:
    secretName: tls-headlamp-ingress

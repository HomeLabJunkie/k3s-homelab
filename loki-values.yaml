deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 168h
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi
    accessModes:
      - ReadWriteOnce
    whenDeleted: Retain
    whenScaled: Retain

gateway:
  enabled: true
  service:
    type: ClusterIP

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

lokiCanary:
  enabled: true

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Traefik Helm values
#
# This file is compatible with the current Traefik Helm chart structure.
# Logging changed from the old top-level "logs:" key to "log:".

deployment:
  replicas: 2

service:
  type: LoadBalancer
  annotations: {}

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# Current Traefik chart uses "log", not "logs".
log:
  level: INFO

ports:
  web:
    # Internal Traefik entrypoint port.
    port: 8000
    expose:
      default: true
    exposedPort: 80
    http:
      # Drop headers whose names alias another header (X_Auth_User for
      # X-Auth-User) so clients cannot spoof headers Traefik manages.
      aliasHeadersStrategy: delete

  websecure:
    # Internal Traefik entrypoint port.
    port: 8443
    expose:
      default: true
    exposedPort: 443
    http:
      aliasHeadersStrategy: delete

  traefik:
    # Keep the management/dashboard entrypoint private.
    port: 9000
    expose:
      default: false
    exposedPort: 9000
    http:
      aliasHeadersStrategy: delete

  metrics:
    http:
      aliasHeadersStrategy: delete

# Preserve the existing behavior for the Rancher backend.
# NOTE: This is a broad TLS verification bypass for upstream connections.
additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"
  # Set legacy naming explicitly to silence the startup warning (the chart omits
  # the flag when false). true would rename routers/services: breaking.
  - "--providers.kubernetescrd.safeNaming=false"

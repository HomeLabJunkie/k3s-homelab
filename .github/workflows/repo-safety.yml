name: repo-safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Toolchain policy sync
        run: ./scripts/check-requirements-toolchain-sync.sh
      # tests/test-rotate-sops-age-key.sh needs both. sops is pinned by
      # version and checksum; age comes from the runner's package archive.
      - name: Install sops and age
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          curl -fsSL -o /tmp/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum --check --quiet
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - name: Maintenance safety tests
        run: |
          ./tests/test-maintain-node-validation.sh
          ./tests/test-maintain-cluster.sh
          python3 tests/test-update-os.py
          ./tests/test-workstation-readiness.sh
          ./tests/test-dr-monitor-bundle-age.sh
          ./tests/test-alertmanager-config.sh
          ./tests/test-backup-latest-symlink.sh
          ./tests/test-backup-bundle-permissions.sh
          ./tests/test-rotate-sops-age-key.sh
          ./tests/test-verify-velero.sh
          ./tests/test-restore-backup-choice.sh
      # Argo CD renders these charts from main, so a chart that does not
      # render must not merge. ci-values.yaml stands in for the settings in
      # the private configuration repository.
      - name: Render charts
        run: |
          for chart in charts/*/ apps/argocd/applications/; do
            values=()
            [[ -f "${chart}ci-values.yaml" ]] && values=(--values "${chart}ci-values.yaml")
            echo "==> $chart"
            helm template check "$chart" "${values[@]}" >/dev/null
          done
      - name: Secret/config scan
        run: ./scripts/scan-secrets.sh
